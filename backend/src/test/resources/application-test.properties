# ---------------------------------------------------------
# ISOLATED TEST CONFIGURATION
# Uses H2 in-memory database in MySQL mode — no external database required.
# Runs successfully in clean CI environments without a pre-existing MySQL server.
# ---------------------------------------------------------

# H2 embedded database in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# JWT
jwt.secret=a-very-secure-jwt-secret-key-for-testing-purposes-only-do-not-use-in-prod
jwt.expirationMs=86400000

# App URLs
app.base-url=http://localhost:8080
app.frontend.login-url=http://localhost:5173/login
app.frontend.reset-url=http://localhost:5173/reset-password
app.frontend.allowed-origins=http://localhost:5173,http://localhost:5174

# Enable bypass so SMTP failure does not block auth tests
app.dev.bypass-email-verification=true
