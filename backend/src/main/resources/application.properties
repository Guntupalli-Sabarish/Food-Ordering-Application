spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------
# Server — bind to PORT env var (required by Render/Railway/Fly)
# ---------------------------------------------------------
server.port=${PORT:8080}

# ---------------------------------------------------------
# Startup performance — lazy init defers bean creation to first
# request, cutting cold-start from ~150s to ~15s on free-tier hosts
# ---------------------------------------------------------
spring.main.lazy-initialization=true
spring.jpa.defer-datasource-initialization=true

# ---------------------------------------------------------
# SMTP settings — all required in production via environment
# ---------------------------------------------------------
smtp.host=${SMTP_HOST:${MAIL_HOST:}}
smtp.port=${SMTP_PORT:${MAIL_PORT:587}}
smtp.username=${SMTP_USERNAME:${MAIL_USERNAME:}}
smtp.password=${SMTP_PASSWORD:${MAIL_PASSWORD:}}
smtp.from=${SMTP_FROM:${MAIL_FROM:}}
smtp.ssl=${SMTP_SSL:${MAIL_SSL:false}}
smtp.starttls=${SMTP_STARTTLS:${MAIL_STARTTLS:true}}
smtp.timeoutMs=${SMTP_TIMEOUT_MS:${MAIL_TIMEOUT_MS:10000}}

# ---------------------------------------------------------
# JWT — must be set via environment; no default
# ---------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ---------------------------------------------------------
# App URLs — must be set via environment; no localhost default
# ---------------------------------------------------------
app.base-url=${APP_BASE_URL}
app.frontend.login-url=${APP_FRONTEND_LOGIN_URL}
app.frontend.reset-url=${APP_FRONTEND_RESET_URL}
app.frontend.allowed-origins=${APP_ALLOWED_ORIGINS}

# ---------------------------------------------------------
# Database — must be set via environment; no root default
# ---------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------
# JPA — safe production defaults
# ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
# Connection pool tuning for Neon (serverless Postgres)
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ---------------------------------------------------------
# Swagger — disabled by default in production
# ---------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false
springdoc.swagger-ui.use-root-path=true
springdoc.override-with-generic-response=false

# ---------------------------------------------------------
# Security — email bypass is FALSE in production
# ---------------------------------------------------------
app.dev.bypass-email-verification=false
