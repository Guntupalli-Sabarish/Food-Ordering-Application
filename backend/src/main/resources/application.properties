spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# SMTP settings
smtp.host=${SMTP_HOST:}
smtp.port=${SMTP_PORT:587}
smtp.username=${SMTP_USERNAME:}
smtp.password=${SMTP_PASSWORD:}
smtp.from=${SMTP_FROM:}
smtp.ssl=${SMTP_SSL:false}
smtp.starttls=${SMTP_STARTTLS:true}
smtp.timeoutMs=${SMTP_TIMEOUT_MS:10000}

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# App URLs
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend.login-url=${APP_FRONTEND_LOGIN_URL:http://localhost:5173/login}
app.frontend.reset-url=${APP_FRONTEND_RESET_URL:http://localhost:5173/reset-password}

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/fooddb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false
springdoc.swagger-ui.use-root-path=true
springdoc.override-with-generic-response=false

# Development only bypass
app.dev.bypass-email-verification=true
