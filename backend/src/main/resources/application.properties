spring.application.name=backend
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------
# SMTP settings - all via environment variables
# ---------------------------------------------------------
smtp.host=${SMTP_HOST}
smtp.port=${SMTP_PORT:587}
smtp.username=${SMTP_USERNAME}
smtp.password=${SMTP_PASSWORD}
smtp.from=${SMTP_FROM}
smtp.ssl=${SMTP_SSL:false}
smtp.starttls=${SMTP_STARTTLS:true}
smtp.timeoutMs=${SMTP_TIMEOUT_MS:10000}

# ---------------------------------------------------------
# JWT Configuration - must be set in environment
# ---------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ---------------------------------------------------------
# App URLs - must be set in environment, no localhost defaults
# ---------------------------------------------------------
app.base-url=${APP_BASE_URL}
app.frontend.login-url=${APP_FRONTEND_LOGIN_URL}
app.frontend.reset-url=${APP_FRONTEND_RESET_URL}
app.frontend.allowed-origins=${APP_ALLOWED_ORIGINS}

# ---------------------------------------------------------
# Database Configuration - must be set in environment
# ---------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------
# JPA Configuration
# ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------
# Swagger/OpenAPI Configuration - disable in prod
# ---------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false
springdoc.swagger-ui.use-root-path=true
springdoc.override-with-generic-response=false

# ---------------------------------------------------------
# Security - bypass must NEVER be true in production
# ---------------------------------------------------------
app.dev.bypass-email-verification=false
