spring.config.activate.on-profile=dev

# ---------------------------------------------------------
# SMTP — empty so email bypass activates in dev
# ---------------------------------------------------------
smtp.host=
smtp.username=
smtp.password=
smtp.from=

# ---------------------------------------------------------
# App URLs — localhost defaults for development
# ---------------------------------------------------------
app.base-url=http://localhost:8080
app.frontend.login-url=http://localhost:5173/login
app.frontend.reset-url=http://localhost:5173/reset-password
app.frontend.allowed-origins=http://localhost:5173,http://localhost:5174

# ---------------------------------------------------------
# Database — local Docker MySQL defaults
# ---------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3307/fooddb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# ---------------------------------------------------------
# JPA — verbose logging in development
# ---------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------
# Swagger — enabled in development
# ---------------------------------------------------------
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

app.dev.bypass-email-verification=true
