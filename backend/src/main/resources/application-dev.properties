spring.config.activate.on-profile=dev

# ---------------------------------------------------------
# SMTP - use empty defaults so email bypass activates
# ---------------------------------------------------------
smtp.host=
smtp.username=
smtp.password=
smtp.from=

# ---------------------------------------------------------
# JWT
# ---------------------------------------------------------
jwt.secret=dev-only-secret-do-not-use-in-production-must-be-32-chars-or-more

# ---------------------------------------------------------
# App URLs (localhost defaults)
# ---------------------------------------------------------
app.base-url=http://localhost:8080
app.frontend.login-url=http://localhost:5173/login
app.frontend.reset-url=http://localhost:5173/reset-password
app.frontend.allowed-origins=http://localhost:5173,http://localhost:5174

# ---------------------------------------------------------
# Database (local MySQL)
# ---------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3307/fooddb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# ---------------------------------------------------------
# Show SQL in development
# ---------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------
# Swagger enabled in development
# ---------------------------------------------------------
springdoc.swagger-ui.enabled=true

# ---------------------------------------------------------
# Development bypass for email verification
# ---------------------------------------------------------
app.dev.bypass-email-verification=true
